name: "Gradle build"
permissions: {}
on:
  - push
  - pull_request
  - workflow_dispatch

jobs:
  build:
    name: "Gradle build"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout sources"
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: "Setup Java"
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "18"
      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GradleEncryptionKey }}
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"
      - name: "Setup matchers"
        run: |
          matchers_dir='${{ github.workspace }}/.github/matchers'
          matcher_list()
          {
            echo 'gradle-build-matcher.json'
            echo 'gradle-build-kotlin-error-matcher.json'
          }

          matcher_list | while IFS='' read -r NAME; do
            if test -f "${matchers_dir:?}/${NAME:?}"; then
              echo "::add-matcher::${matchers_dir:?}/${NAME:?}"
              echo "Matcher configured: ${NAME:?}"
            fi
          done
      - name: "Normalize apostrophes in French Android resources"
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("play-services-core/src/main/res/values-fr-rFR/strings.xml")
          text = path.read_text(encoding="utf-8")

          # Android string resources require apostrophes to be escaped unless
          # the complete value is quoted. Escape only unescaped apostrophes
          # inside string elements; leave comments and XML attributes untouched.
          pattern = re.compile(r'(<string\b[^>]*>)(.*?)(</string>)', re.DOTALL)
          def fix(match):
              value = match.group(2)
              value = re.sub(r"(?<!\\)'", r"\\'", value)
              return match.group(1) + value + match.group(3)

          fixed = pattern.sub(fix, text)
          if fixed != text:
              path.write_text(fixed, encoding="utf-8")
              print("Escaped unescaped apostrophes in French Android strings.")
          else:
              print("French Android strings already normalized.")
          PY
      - name: "Execute Gradle assemble"
        run: "./gradlew --no-daemon clean assemble"
      - name: "Execute Gradle check"
        run: "./gradlew --no-daemon check"
